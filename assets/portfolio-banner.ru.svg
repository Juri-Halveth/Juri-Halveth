<text x="60" y="241" font-family="Georgia,serif" font-style="italic" font-size="34" fill="#e0eab4">Программы. Миры. Исследования.</text>
<text x="60" y="291" font-family="Arial,sans-serif" font-size="16" fill="#b8cec0">Развивать идеи. Показывать работу. Открывать код.</text>
